# slideshow-builder project configuration.
#
# Copy this file to <project folder>/config.toml. The intake in the skill fills it from the
# owner's answers; every stage reads it and refuses to run without it. Paths may be absolute
# or relative to the folder holding this file. Dates are TOML dates (YYYY-MM-DD, unquoted).
# Nothing here is uploaded anywhere; it stays in the project folder with the photos.

[project]
name = "my-slideshow"         # recorded; not read by this version
timezone = "UTC"              # IANA zone used to read video container timestamps (e.g. "Europe/Berlin")
work = "work"                 # flat working copy of every source file, plus quarantine subfolders
index = "index"               # items.csv, flags.csv, people.csv, selection.csv, sheets/
handoff = "handoff"           # the frozen set: media/, media.csv, features.txt, cut-list.csv, changes.log
build = "build"               # tiles/, clips/, frames/, player.html, renders

# One entry per place the photos come from. kind: takeout (the zips) | apple-photos | icloud | folder (a folder tree, an unzipped Takeout included: its JSON sidecars beside the files are read)
[[sources]]
path = "sources/takeout"
kind = "takeout"

[[sources]]
path = "sources/phone-export"
kind = "folder"

[honoree]
name = "the honoree"          # printed on contact sheets; never used to guess anything
birth_year = 2000             # first year of a whole-life show
birth_month = 1               # 1-12; pro-rates the first year's cap

[family]
names = ["the honoree"]       # the people who count as family for the selection
gate = "people"               # none: no people check. people: any person in frame passes. family: the identify stage must see one of the names
seed_photos = "seeds"         # folder with <name>/*.jpg, 5 to 20 clear photos per person, for the identify stage; recorded, not read by this version (the face-matching milestone)

[show]
event = "the event"
event_date = 2000-01-01
hard_stop = 2000-01-01        # last day a finished file may still be produced; recorded, not read by this version
# scope_start = 2000-09-01    # first day of the scope (a TOML date); its year and month set the first year and pro-rate its cap
# scope_end = 2013-06-30      # last day of the scope; its year and month set the last year and pro-rate its cap
first_year = 2000             # scope; defaults to the honoree's birth year
last_year = 2000              # scope; defaults to the event year
theme = "whole-life"          # recorded; not read by this version (whole-life | trip | activity | stage | people | traditions, see references/04)
playback = "loop"             # loop: the file plays on repeat. once: the show plays through and stops on the end card
title_card = ""               # words held before the mosaic; "" = none. Triple quotes for more than one line, at most 6
end_card = ""                 # words held after the one pass; only reached when playback = "once"
card_seconds = 6              # how long each card holds
card_fade_s = 1               # fade in and out, at most half of card_seconds
loop_minutes_target = 15      # the loop length the cap is derived from when cap_per_year = 0
must_include = []             # filenames or media_ids the owner named; select seats them like pins and warns about a miss
off_limits = []               # filenames, media_ids, or a file or folder path (every file in it); the family's call, the skill
                              # never decides this. select cuts these files and add-item refuses them

[audio]                       # music under the show; the DJ's sound is the alternative (enabled = false)
enabled = false               # true: the soundtrack is mixed into the rendered file and the live player plays it
files = []                    # in play order, absolute or relative to this folder; .mp3 .m4a .aac .wav .flac .ogg .opus
loop = true                   # repeat the playlist until it covers the video
crossfade_s = 2               # seconds between consecutive tracks
fade_s = 2                    # seconds of fade in at the start and out at the end of the soundtrack
volume = 1.0                  # 0.0 to 2.0, applied to the soundtrack

[selection]
lens = "v4"                   # v1 quality | v2 people and motion | v3 breadth | v4 synthesis (recommended)
period = "year"               # year | quarter | month: the bucket the cap counts in. A trip wants month
undated_cap = 0               # how many undated files select --include-undated may seat; 0 = none, as before
cap_per_year = 0              # the cap per period; 0 = derive it from [show] loop_minutes_target and the tile size
prorate_partial_years = true  # first year from scope_start or birth_month, last year up to scope_end or event_date
diversity_distance = 26       # no pick within this perceptual distance of a seated pick
featured_fraction = 0.1667    # about one in six stills take larger tiles
featured_min_per_year = 2
motion_per_month = 1          # one video or Live Photo per month before the general pool

# [selection.cap_overrides]   # a period's cap after pro-rating; keys are years in the scope, or period keys
                              # ("2020-Q2", "2020-05"); a year sets every period inside it. Values whole numbers
# 2020 = 3

[selection.weights]           # the v4 score; each 0 or more, normalised to sum 1 when they do not
person_area = 0.40            # how much of the frame is people
group = 0.10                  # person count, capped at six
sharpness = 0.20              # Laplacian variance percentile within the year
resolution = 0.15             # pixel-count percentile within the year
consensus = 0.15              # how many of v1 to v3 chose the item

[selection.featured]          # a still may take a larger tile only when it passes all of these
max_people = 3                # at most this many people in frame
min_short_side = 1000         # pixels
min_long_side = 1500          # pixels
min_sharpness_pct = 0.10      # sharpness percentile among the selected stills, 0 to 1

[priors]
# Owner-declared rules about the export, applied only as a prior and validated against files
# that also carry EXIF. Off by default: they were specific to the first run's sources.
calendar_folder_year_rule = false     # a "<year> calendar" folder holds photos taken in <year + offset>
calendar_folder_year_offset = -1
filename_month_rule = false           # a month name inside a filename dates the file to that month
folder_year_rule = false              # a four-digit year in a source folder's name dates its files to that year (precision year)

# Recurring events the owner names. Seated before the general pool, tagged on the sheets.
# Delete the examples you do not use; an empty section is fine.
[[anchors.date_window]]
tag = "AUTUMN-TRADITION"
month = 10
day_from = 24
day_to = 31

[[anchors.place]]
tag = "WINTER-TRIP"
lat = 0.0
lon = 0.0
radius_km = 15

[[anchors.pinned]]
tag = "LEAVES"
files = { }                   # { 2020 = "2020-10-18_filename.jpg", 2021 = "..." }; one file per year

[pins]
files = []                    # owner pins: seated first, never dropped by a date correction

[output]                      # the display the show plays on; layout, player and render all derive from these
resolution = ""               # the display's LOGICAL resolution, "WxH". Blank: Step 0 (`python curate/setup.py --project
                              # <folder> --apply`) writes the build machine's; for a different display machine the intake
                              # writes its answer. Blank at build time means 2560x1440 (the first run) with a warning
fps = 60                      # 30 or 60; 30 halves the render time and is what TVs and older laptops decode easily
concat_copies = 3             # copies of the loop concatenated for playback, so the player's own seam lands rarely
quality = "final"             # final (x264 slow, crf 18) | draft (veryfast, crf 23, for quick test renders)

[taste]
tile_size = "medium"          # small | medium | large: row heights as a share of the screen height; large for a wall
                              # seen from across a room. medium is the first run's 520/820 px at 1440 rows
scroll_speed = 0              # px/s at the output resolution; 0 = the first run's pace (100 px/s at 1440) scaled
background = "#07070F"        # near-black behind the tiles
# base_row_height = 520       # pixels; uncomment to override the tile_size preset
# feature_row_height = 820
order = "chapters"            # chapters | chronological | shuffled (shuffled is a deterministic function of seed)
motion_density = "normal"     # calm | normal | busy: how many tiles move at once
mixed_tiles = true            # false: no larger tiles, videos in the grid
include_videos = true         # false: no standalone videos in the show (cut as excluded-type)
include_gifs = true           # false: no animated GIFs (cut as excluded-type)
live_photos = "clip"          # clip | still
slow_motion = "slow"          # slow | realtime; per-file exceptions in <project>/prep-options.json
seed = 20260905               # read only by order = "shuffled": the same seed gives the same shuffled sequence
videos_silent = true          # recorded; not read by this version (clips are always silent)
chapters = 0                  # 0 = ten chapters; any other value is used by the build
captions = "none"             # none | date (each tile's date at its own precision) | text (the caption column of media.csv,
                              # which handoff fills from the export's sidecar description)

[machines]
build_os = ""                 # filled by Step 0
display_os = ""               # the intake's answer; blank when it is the build machine
player = "vlc"                # vlc | tv-usb | browser: the VLC launchers; a TV stick's H.264 level and the 4 GB warning; Chrome kiosk launchers

[models]
# Blank = the setup step's defaults (YOLOv8n exported to ONNX, YuNet). See curate/models/README.md
# for licenses. Any ONNX detector that outputs boxes and scores works.
person_detector = ""
person_input_size = 640
person_class_index = 0
face_detector = ""
face_embedder = ""           # recorded; not read by this version (the face-matching milestone)

[tools]
# Blank = found on PATH, or in the repository's tools/ffmpeg/ for ffmpeg and ffprobe. Set a path by hand when a tool
# lives elsewhere; Step 0 reports where it found each tool but does not write this section.
ffmpeg = ""
ffprobe = ""
chrome = ""
vlc = ""                      # recorded; not read by this version (Step 0 and the launchers find VLC on their own)
